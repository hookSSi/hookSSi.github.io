---
layout: default
---

<a class="back-link" href="{{ "/" | relative_url }}">{{ site.theme_config.back_home_text }}</a>

<h1 class="post-title">{{ page.title }}</h1>

{% if page.date or page.categories %}
<p class="post-meta">
  {% if page.date %}
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: site.theme_config.date_format }}</time>
  {% endif %}
  {% for category in page.categories %}
    <a class="post-category" href="{{ "/blog.html" | relative_url }}#cat-{{ category }}">{{ category }}</a>
  {% endfor %}
</p>
{% endif %}

{{ content }}
